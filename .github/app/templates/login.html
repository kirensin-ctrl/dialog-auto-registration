<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Вход организатора — Диалог Авто × HAVAL CITY</title>
<style>
:root{color-scheme:light;--ink:#1d2430;--muted:#5d6878;--line:#d5dbe3;--accent:#1d2430;--bg:#eef1f5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);padding:16px}
main{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px;box-shadow:0 20px 50px rgba(29,36,48,.08)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-size:24px;margin:8px 0 24px}
label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
input{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px}
input:focus{outline:2px solid #72839b;outline-offset:1px}
button{margin-top:20px;width:100%;font:inherit;font-weight:600;padding:13px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
.error{margin:0 0 16px;padding:10px 12px;border-radius:10px;background:#fdecec;color:#9b1c1c;font-size:14px}
a{color:var(--muted);font-size:14px;display:inline-block;margin-top:20px}
</style>
</head>
<body>
<main>
<div class="eyebrow">Диалог Авто × HAVAL CITY</div>
<h1>Панель организатора</h1>
{{error}}
<form method="post" action="/admin/login">
<input type="hidden" name="return_to" value="{{returnTo}}">
<label for="password">Пароль</label>
<input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
<button type="submit">Войти</button>
</form>
<a href="/">← На сайт мероприятия</a>
</main>
</body>
</html>
